<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Inicio de Sesión</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 3px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #cargando {
            display: none;
            text-align: center;
            color: #777;
            margin-top: 20px;
        }

        #resultado {
            text-align: center;
            margin-top: 20px;
        }

        .exito {
            color: #4CAF50;
            font-size: 22px;
            margin: 10px 0;
        }

        .tarjeta-saldo {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 15px;
            margin: 20px auto;
            max-width: 300px;
            background-color: #f9fff9;
        }

        .saldo-valor {
            font-size: 28px;
            font-weight: bold;
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Iniciar Sesión</h1>
        <form id="formulario" action="#" target="_self">
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" placeholder="Ingrese su correo electrónico" required>

            <label for="passwd">Contraseña:</label>
            <input type="password" id="passwd" name="passwd" placeholder="Ingrese su contraseña" required>

            <button type="submit">Ingresar</button>
        </form>

        <p id="cargando">Verificando credenciales...</p>

        <div id="resultado"></div>
    </div>

    <script>
        document.getElementById("formulario").addEventListener("submit", function(event) {
            event.preventDefault(); // Evitar que el formulario se envíe

            var correo = document.getElementById("email").value;

            // Ocultamos el formulario y mostramos un mensaje de espera
            document.getElementById("formulario").style.display = "none";
            document.getElementById("cargando").style.display = "block";

            // Simulamos que el servidor tarda 3 segundos en responder.
            // Recién entonces el saldo aparece en el DOM.
            setTimeout(function() {
                document.getElementById("cargando").style.display = "none";
                document.getElementById("resultado").innerHTML = `
                    <p class="exito">&#10004; ¡Inicio de sesión exitoso!</p>
                    <p>Bienvenido/a, <strong>${correo}</strong></p>
                    <div class="tarjeta-saldo">
                        <p>Saldo actual:</p>
                        <span id="saldo" class="saldo-valor">$13.250,00</span>
                    </div>
                `;
            }, 3000);
        });
    </script>
</body>
</html>
